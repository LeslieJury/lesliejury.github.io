<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects</title>
    <link rel="stylesheet" href="css/home.css">   
    <link rel="stylesheet" href="https://use.typekit.net/ggk3wtx.css">
    <script src="js/projects.js" defer></script>
    <script src="js/components.js" defer></script>

</head>
<body>
    <header id="top-banner"></header>
    <main>
        <div class="main-section" id="left-section"></div>
        
        <div class="main-section" id="center-section">
            <div id="projects">
                <h2 id="project-header">✦ PROJECTS</h2>
                
                <div class="project-filter-header"><span>FILTER BY</span><button type="button" class="filter-button is-active" data-filter="">All projects</button><button type="button" class="filter-button" data-filter="c">C</button><button type="button" class="filter-button" data-filter="stm32">STM32</button><button type="button" class="filter-button" data-filter="hardware">Hardware</button><button type="button" class="filter-button" data-filter="embedded systems">Embedded Systems</button><button type="button" class="filter-button" data-filter="web development">Web Development</button><button type="button" class="filter-button" data-filter="software">Software</button></div>
                <input type="text" id="searchInput" class="search-input" placeholder="Search projects by tag, language, or title...">
                
                <div class="grid-container" id="project-grid"></div>
            </div>
        </div>
        
        <div class="main-section" id="right-section"></div>
    </main>
</body>
</html>
